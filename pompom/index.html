<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D model</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body data-character="pompom">
  <div id="stage"></div>
  <header>
    <h1>pompom purin?</h1>
    <p>一緒に遊んだり、色を変えられるよ</p>
  </header>
  <button id="btnScreenshot" class="screenshot-button" type="button" aria-label="スクリーンショットを保存" title="スクリーンショットを保存">
    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
      <path d="M7 7.5 8.4 5h7.2L17 7.5h2.5A1.5 1.5 0 0 1 21 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5V9a1.5 1.5 0 0 1 1.5-1.5H7Z" />
      <circle cx="12" cy="13" r="3.5" />
    </svg>
  </button>
  <div class="ui-bottom">
    <div class="category-tabs" role="tablist" aria-label="あそびの種類">
      <button class="category-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="category-play" data-category="play">あそぶ</button>
      <button class="category-tab" type="button" role="tab" aria-selected="false" aria-controls="category-umbrella" data-category="umbrella">かさ</button>
      <button class="category-tab" type="button" role="tab" aria-selected="false" aria-controls="category-color" data-category="color">いろ</button>
    </div>
    <div class="category-panels">
      <section id="category-play" class="category-panel is-active" role="tabpanel">
        <div class="controls">
          <button id="btnRandomPlay" class="featured-control">✨おまかせあそび</button>
          <button id="btnFront">まえをむく</button>
          <button id="btnJump">🦘Jump！</button>
          <button id="btnTakeAway">つれていく</button>
          <button id="btnWave">てをふる</button>
          <button id="btnBothWave">りょうてをふる</button>
          <button id="btnKenkenpa">ケンケンパ</button>
          <button id="btnWink">ウィンク</button>
          <button id="btnSpin">くるっとまわる</button>
          <button id="btnHeadSpin">あたまをまわす</button>
          <button id="btnTouch">タッチ</button>
        </div>
      </section>
      <section id="category-umbrella" class="category-panel" role="tabpanel" hidden>
        <div class="controls">
          <button id="btnUmbrellaHold">☂️をもつ</button>
          <button id="btnUmbrellaOpen">OPEN☂️</button>
          <button id="btnUmbrellaClose">CLOSE☂️</button>
          <button id="btnUmbrellaRelease">☂️をはなす</button>
        </div>
      </section>
      <section id="category-color" class="category-panel" role="tabpanel" hidden>
        <div class="color-presets" aria-label="色のプリセット">
          <button class="color-preset" type="button" data-preset="pudding">🍮プリン</button>
          <button class="color-preset" type="button" data-preset="strawberry">🍓いちご</button>
          <button class="color-preset" type="button" data-preset="sky">☁️そら</button>
          <button class="color-preset" type="button" data-preset="night">🌙よる</button>
        </div>
        <div class="palette">
          <label class="color-pick" for="bodyColor">Body
            <input type="color" id="bodyColor" value="#fffdf6" />
          </label>
          <label class="color-pick" for="hatColor">Hat
            <input type="color" id="hatColor" value="#8b5e3c" />
          </label>
          <label class="color-pick" for="faceColor">Face
            <input type="color" id="faceColor" value="#5a3e2b" />
          </label>
          <label class="color-pick" for="umbrellaColor">Umbrella
            <input type="color" id="umbrellaColor" value="#4caf50" />
          </label>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./script.js"></script>
</body>

</html>
