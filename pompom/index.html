<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D model</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body data-character="pompom">
  <div id="stage"></div>
  <header>
    <h1>pompom purin?</h1>
    <p>一緒に遊んだり、色を変えられるよ</p>
  </header>
  <div class="top-actions">
    <button id="btnPhotoMode" class="screenshot-button" type="button" aria-label="写真モードを開く" title="写真モードを開く">
      <span aria-hidden="true">🖼️</span><span>Mode</span>
    </button>
    <button id="btnScreenshot" class="screenshot-button" type="button" aria-label="スクリーンショットを保存" title="スクリーンショットを保存">
      <span aria-hidden="true">📸</span><span>Photo</span>
    </button>
  </div>
  <div id="photoFrame" class="photo-frame" aria-hidden="true"></div>
  <div id="photoStamps" class="photo-stamps" aria-hidden="true"></div>
  <div id="photoTools" class="photo-tools" aria-label="写真モードの操作">
    <button id="btnFrame" type="button">🌈 Frame</button>
    <button class="stamp-choice is-selected" type="button" data-stamp="💖">💖</button>
    <button class="stamp-choice" type="button" data-stamp="⭐">⭐</button>
    <button class="stamp-choice" type="button" data-stamp="🌸">🌸</button>
    <button id="btnPhotoSave" type="button">📸 Save</button>
    <button id="btnPhotoExit" type="button">✕ Exit</button>
  </div>
  <div class="ui-bottom">
    <div class="category-tabs" role="tablist" aria-label="あそびの種類">
      <button class="category-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="category-play" data-category="play">🎮 Play</button>
      <button class="category-tab" type="button" role="tab" aria-selected="false" aria-controls="category-umbrella" data-category="umbrella">☂️ Umbrella</button>
      <button class="category-tab" type="button" role="tab" aria-selected="false" aria-controls="category-color" data-category="color">🎨 Colors</button>
    </div>
    <div class="category-panels">
      <section id="category-play" class="category-panel is-active" role="tabpanel">
        <div class="controls">
          <button id="btnRandomPlay" class="featured-control" data-action="randomPlay">✨ Random</button>
          <button id="btnFront" data-action="front">🐰 Front</button>
          <button id="btnJump" data-action="jump">🦘 Jump</button>
          <button id="btnTakeAway" data-action="takeAway">🚀 Fly Away</button>
          <button id="btnWave" data-action="wave">👋 Wave</button>
          <button id="btnBothWave" data-action="bothWave">🙌 Both Wave</button>
          <button id="btnKenkenpa">🦶 Hopscotch</button>
          <button id="btnWink" data-action="wink">😉 Wink</button>
          <button id="btnSpin" data-action="spin">🌀 Spin</button>
          <button id="btnHeadSpin" data-action="headSpin">🤪 Head Spin</button>
          <button id="btnPowerSpin" data-action="powerSpin">💥 Power Spin</button>
          <button id="btnTouch" data-action="touch">👆 Touch</button>
        </div>
      </section>
      <section id="category-umbrella" class="category-panel" role="tabpanel" hidden>
        <div class="controls">
          <button id="btnUmbrellaHold" data-action="umbrellaHold">🤲 Hold</button>
          <button id="btnUmbrellaOpen" data-action="umbrellaOpen">☂️ Open</button>
          <button id="btnUmbrellaClose" data-action="umbrellaClose">☂️ Close</button>
          <button id="btnUmbrellaRelease" data-action="umbrellaRelease">🎈 Release</button>
        </div>
      </section>
      <section id="category-color" class="category-panel" role="tabpanel" hidden>
        <div class="color-presets" aria-label="色のプリセット">
          <button class="color-preset" type="button" data-preset="pudding">🍮 Pudding</button>
          <button class="color-preset" type="button" data-preset="strawberry">🍓 Strawberry</button>
          <button class="color-preset" type="button" data-preset="sky">☁️ Sky</button>
          <button class="color-preset" type="button" data-preset="night">🌙 Night</button>
        </div>
        <div class="palette">
          <label class="color-pick" for="bodyColor">🤍 Body
            <input type="color" id="bodyColor" value="#fffdf6" />
          </label>
          <label class="color-pick" for="hatColor">🎩 Hat
            <input type="color" id="hatColor" value="#8b5e3c" />
          </label>
          <label class="color-pick" for="faceColor">🙂 Face
            <input type="color" id="faceColor" value="#5a3e2b" />
          </label>
          <label class="color-pick" for="umbrellaColor">☂️ Umbrella
            <input type="color" id="umbrellaColor" value="#4caf50" />
          </label>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./script.js"></script>
</body>

</html>
